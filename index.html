<!doctype html>
<html lang="ru">
<head>

<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#191919;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px 20px}.card{width:100%;max-width:460px}.brand{font-weight:750;font-size:15px;letter-spacing:.04em;margin:0 0 44px}.tag{display:inline-block;background:#e7e7dc;padding:8px 12px;border-radius:30px;font-size:13px}h1{font-size:clamp(30px,7vw,40px);line-height:1.12;letter-spacing:-.035em;margin:18px 0}p{font-size:17px;line-height:1.6;color:#56564e}.price{padding:23px 0;margin:26px 0;border-block:1px solid #d8d8ce;display:flex;align-items:baseline;gap:12px}.price strong{font-size:38px;letter-spacing:-.04em}.price span{color:#56564e}a.button{display:block;text-align:center;text-decoration:none;font-weight:650;padding:17px;border-radius:14px;background:#191919;color:#fff;margin-top:12px}a.button:hover{background:#37372f}a.phone{color:inherit;white-space:nowrap}.contact{background:#eaeae1;border-radius:14px;padding:18px;margin-top:12px;font-size:15px;line-height:1.6}.contact strong{display:block}footer{font-size:12px;color:#75756c;margin-top:32px;line-height:1.5}a:focus-visible{outline:3px solid #4263eb;outline-offset:4px}
</style>
</head>

<a class="button" href="https://vk.ru/yuradanilchenko" target="_blank" rel="noopener noreferrer">Написать во ВКонтакте</a>
<div class="contact"><strong>Или свяжитесь в MAX по номеру</strong><a class="phone" href="tel:+79168374259">+7 916 837-42-59</a></div>
<footer>Точка Подсчёта · Данильченко Юрий</footer>
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {updateViaCache: 'none'})
      .then(registration => registration.update()).catch(() => {});
  });
}
</script>
